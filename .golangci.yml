# golangci-lint v2 configuration for idmlbuild.
#
# The linter set is strict for library code. Test files are exempt from gosec
# and errcheck, where the noise outweighs the value.

version: "2"

run:
  timeout: 10m
  tests: true
  go: "1.26"

linters:
  enable:
    - govet           # built-in static analyzer
    - staticcheck     # bugs, simplifications and deprecations
    - errcheck        # unchecked errors
    - ineffassign     # assignments that are never used
    - unused          # dead code
    - misspell        # misspelled words in comments and strings
    - gosec           # security-relevant patterns
    - forcetypeassert # unchecked type assertions panic on mismatch
    - nilerr          # returning nil while an error is in hand
    - modernize       # code that can use newer Go features
  exclusions:
    rules:
      # Tests may ignore errors and use fixed permissions freely.
      - path: _test\.go
        linters:
          - gosec
          - errcheck
          - forcetypeassert
