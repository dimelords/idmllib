# CI/CD Pipeline for idmlbuild
# Runs linting, tests with coverage, vulnerability scanning and builds on every
# push and pull request. The Go version comes from go.mod so CI and developers
# always agree.

name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.13.2
          args: --timeout=5m --config=.golangci.yml
      - name: Run golangci-lint (cmd module)
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.13.2
          working-directory: cmd
          args: --timeout=5m --config=../.golangci.yml

  test:
    name: Test (Go ${{ matrix.go-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        # go.mod's version plus the newest stable release
        go-version: ['1.26', '1.27']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          check-latest: true
      - name: Download dependencies
        run: go mod download
      - name: Run tests with race detector and coverage
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...
      - name: Vet the cmd module
        working-directory: cmd
        run: go vet ./...
      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1 | awk '{print "Coverage: " $3}'
      - name: Upload coverage to Codecov
        if: matrix.go-version == '1.26'
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./coverage.out
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
      - name: Upload coverage artifact
        if: matrix.go-version == '1.26'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.out

  fuzz:
    name: Fuzz smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Fuzz the parsers briefly
        run: |
          go test ./pkg/story  -run '^$' -fuzz=FuzzParseStory  -fuzztime=60s
          go test ./pkg/spread -run '^$' -fuzz=FuzzParseSpread -fuzztime=60s
          go test ./pkg/idml   -run '^$' -fuzz=FuzzReadBytes   -fuzztime=60s

  security:
    name: Security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
      - name: govulncheck (known vulnerabilities in code paths and toolchain)
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: gosec
        uses: securego/gosec@master
        with:
          args: '-severity medium -confidence medium -exclude-dir=testdata ./...'

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Build CLI and tools (cmd module)
        working-directory: cmd
        run: |
          go build -v -o ../bin/idmlbuild ./cli
          go build -v -o ../bin/debug-export ./debug-export
          ls -la ../bin/
      - uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: bin/

  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [lint, test, fuzz, security, build]
    if: always()
    steps:
      - name: Report
        run: |
          {
            echo "## CI Pipeline Results"
            echo ""
            echo "- Lint: ${{ needs.lint.result }}"
            echo "- Test: ${{ needs.test.result }}"
            echo "- Fuzz: ${{ needs.fuzz.result }}"
            echo "- Security: ${{ needs.security.result }}"
            echo "- Build: ${{ needs.build.result }}"
          } >> "$GITHUB_STEP_SUMMARY"
          for r in "${{ needs.lint.result }}" "${{ needs.test.result }}" "${{ needs.security.result }}" "${{ needs.build.result }}"; do
            if [ "$r" != "success" ]; then exit 1; fi
          done
